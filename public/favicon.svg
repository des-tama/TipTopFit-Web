<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="space" cx="0.5" cy="0.38" r="0.8">
      <stop offset="0" stop-color="#3B1A7A"/>
      <stop offset="0.55" stop-color="#170A40"/>
      <stop offset="1" stop-color="#060317"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C21A82"/>
      <stop offset="1" stop-color="#3A0A55"/>
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#space)"/>

  <!-- faint floating digits -->
  <g font-family="DejaVu Sans Mono, monospace" font-weight="bold" fill="#8F7BFF" opacity="0.22">
    <text x="110" y="250" font-size="90">7</text>
    <text x="820" y="200" font-size="80">3</text>
    <text x="150" y="560" font-size="70">π</text>
    <text x="830" y="520" font-size="90">9</text>
    <text x="250" y="120" font-size="54">2</text>
    <text x="700" y="110" font-size="54">5</text>
  </g>
  <g fill="#FFFFFF">
    <circle cx="90" cy="120" r="4"/><circle cx="330" cy="200" r="3"/><circle cx="930" cy="330" r="4"/>
    <circle cx="760" cy="300" r="3"/><circle cx="80" cy="420" r="3"/><circle cx="950" cy="640" r="3"/>
    <circle cx="300" cy="420" r="3"/><circle cx="730" cy="420" r="3"/>
  </g>

  <!-- synthwave planet -->
  <ellipse cx="512" cy="1290" rx="900" ry="420" fill="#FF2E9A" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="512" cy="1300" rx="860" ry="400" fill="url(#planet)"/>
  <g stroke="#FF7AC8" stroke-width="4" opacity="0.4" fill="none">
    <path d="M-100 965 Q512 925 1124 965"/>
    <line x1="380" y1="905" x2="300" y2="1024"/><line x1="644" y1="905" x2="724" y2="1024"/>
    <line x1="230" y1="915" x2="80" y2="1024"/><line x1="794" y1="915" x2="944" y2="1024"/>
  </g>

  <!-- exhaust glow -->
  <ellipse cx="512" cy="830" rx="120" ry="150" fill="#FF7A1F" opacity="0.45" filter="url(#soft)"/>

  <!-- ROCKET MADE OF MATH SYMBOLS -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)">
    <!-- nose: power caret ^ -->
    <path d="M436 352 L512 170 L588 352" stroke="#FF4FB0" stroke-width="44"/>
    <!-- body: parentheses ( ) -->
    <path d="M440 372 Q392 540 440 706" stroke="#3DEBFF" stroke-width="40"/>
    <path d="M584 372 Q632 540 584 706" stroke="#3DEBFF" stroke-width="40"/>
    <!-- fins: inequality signs < > -->
    <path d="M422 596 L330 690 L422 742" stroke="#FF4FB0" stroke-width="38"/>
    <path d="M602 596 L694 690 L602 742" stroke="#FF4FB0" stroke-width="38"/>
    <!-- porthole: plus in a circle -->
    <circle cx="512" cy="455" r="58" stroke="#FFD23F" stroke-width="26"/>
    <path d="M512 427 L512 483 M484 455 L540 455" stroke="#FFD23F" stroke-width="20"/>
    <!-- equals stripes -->
    <path d="M472 588 L552 588 M472 636 L552 636" stroke="#FFFFFF" stroke-width="26"/>
    <!-- base: minus -->
    <path d="M462 760 L562 760" stroke="#FF4FB0" stroke-width="34"/>
  </g>

  <!-- exhaust: operators bursting out -->
  <g font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="middle" filter="url(#neon)">
    <text x="512" y="855" font-size="110" fill="#FFE066">×</text>
    <text x="440" y="925" font-size="84" fill="#FFA62B">+</text>
    <text x="588" y="925" font-size="84" fill="#FFA62B">÷</text>
    <text x="512" y="985" font-size="70" fill="#FF6A3D">−</text>
    <text x="388" y="990" font-size="56" fill="#FF4F8A">=</text>
    <text x="636" y="990" font-size="56" fill="#FF4F8A">+</text>
  </g>
</svg>
